name: Test, Build, Push to Artifact Registry and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: yt-sailing-dashboard
  REGION: us-central1
  REPO_NAME: yt-sailing-dashboard-containers
  # The full path to your WIF provider (find this in GCP Console > IAM > Workload Identity)
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  ETL_IMAGE_BASE: us-central1-docker.pkg.dev/yt-sailing-dashboard/yt-sailing-dashboard-containers/yt-sailing-channel-etl
  SHINY_IMAGE_BASE: us-central1-docker.pkg.dev/yt-sailing-dashboard/yt-sailing-dashboard-containers/yt-sailing-shiny

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for OIDC authentication

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install R Dependencies
        run: |
          Rscript -e "install.packages(c('testthat', 'here', 'RSQLite', 'DBI', 'glue'))"
          
      - name: Run Unit Tests
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: Rscript tests/testthat.R
        
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

        # Build and Push ETL Image
      - name: Build & Push ETL
        env:
          YT_API_KEY: ${{ env.YT_API_KEY}}
        run: |
          docker build -t ${{ env.ETL_IMAGE_BASE }}:${{ github.sha }} \
                       -t ${{ env.ETL_IMAGE_BASE }}:latest \
                       -f etl/Dockerfile.etl .
          docker push ${{ env.ETL_IMAGE_BASE }} --all-tags

      # Build & Push Shiny Image
      - name: Build & Push Shiny
        run: |
          docker build -t ${{ env.SHINY_IMAGE_BASE }}:${{ github.sha }} \
                       -t ${{ env.SHINY_IMAGE_BASE }}:latest \
                       -f shiny/Dockerfile.shiny .
          docker push ${{ env.SHINY_IMAGE_BASE }} --all-tags
          
      - name: Who Am I?
        run: gcloud auth list
        
      - name: Deploy Shiny to Cloud Run
        run: |
          gcloud run deploy yt-sailing-shiny \
            --image ${{ env.SHINY_IMAGE_BASE }}:latest \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated

      - name: Update ETL Cloud Run Job
        run: |
          gcloud run jobs update yt-sailing-channel-etl-job \
            --image ${{ env.ETL_IMAGE_BASE }}:latest \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region us-central1