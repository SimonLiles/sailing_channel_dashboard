name: Test, Build, Push and Deploy

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: yt-sailing-dashboard
  REGION: us-central1
  ETL_IMAGE_BASE: us-central1-docker.pkg.dev/yt-sailing-dashboard/yt-sailing-dashboard-containers/yt-sailing-channel-etl
  SHINY_IMAGE_BASE: us-central1-docker.pkg.dev/yt-sailing-dashboard/yt-sailing-dashboard-containers/yt-sailing-shiny

jobs:
  # Job 1: Run R tests before touching any infrastructure
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: r-

      - name: Install R Dependencies
        run: Rscript -e "install.packages(c('testthat', 'here', 'RSQLite', 'DBI', 'glue', 'yaml'))"

      - name: Run Unit Tests
        # YT_API_KEY injected here only for tests that need it,
        # never passed to docker build
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: Rscript tests/testthat.R

  # Job 2a: Build and push ETL image (runs in parallel with Job 2b)
  build-etl:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push ETL
        run: |
          docker build \
            -t ${{ env.ETL_IMAGE_BASE }}:${{ github.sha }} \
            -t ${{ env.ETL_IMAGE_BASE }}:latest \
            -f etl/Dockerfile.etl .
          docker push ${{ env.ETL_IMAGE_BASE }} --all-tags

  # Job 2b: Build and push Shiny image (runs in parallel with Job 2a)
  build-shiny:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push Shiny
        run: |
          docker build \
            -t ${{ env.SHINY_IMAGE_BASE }}:${{ github.sha }} \
            -t ${{ env.SHINY_IMAGE_BASE }}:latest \
            -f shiny/Dockerfile.shiny .
          docker push ${{ env.SHINY_IMAGE_BASE }} --all-tags

  # Job 3: Run database schema migration against prod dataset
  # Uses the already-built ETL image (contains all scripts/ and sql/ files).
  # All steps use operations that the daily ETL already runs successfully
  # (CREATE OR REPLACE, MERGE) — no CREATE PROCEDURE or CALL statements.
  migrate:
    needs: build-etl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pin job image to commit SHA
        run: |
          gcloud run jobs update yt-sailing-channel-etl-job \
            --image ${{ env.ETL_IMAGE_BASE }}:${{ github.sha }} \
            --command "Rscript" \
            --args "main.R" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Pre-migration snapshot (safety net)
        run: |
          bq mk --force --dataset ${{ env.PROJECT_ID }}:yt_sailing_data_pre_migration
          bq query --use_legacy_sql=false \
            "CALL \`${{ env.PROJECT_ID }}.yt_sailing_data.clone_dataset\`(
               '${{ env.PROJECT_ID }}', 'yt_sailing_data',
               '${{ env.PROJECT_ID }}', 'yt_sailing_data_pre_migration',
               FALSE, FALSE, FALSE
             )" || echo "WARNING: Snapshot failed — check permissions and that clone_dataset procedure exists."
          echo "Snapshot created. Rollback with:"
          echo "  bq mk --force --dataset ${{ env.PROJECT_ID }}:yt_sailing_data_pre_migration"
          echo "  bq query --use_legacy_sql=false"
          echo "    \"CALL \\\`${{ env.PROJECT_ID }}.yt_sailing_data.clone_dataset\\\`("
          echo "       '${{ env.PROJECT_ID }}', 'yt_sailing_data_pre_migration',"
          echo "       '${{ env.PROJECT_ID }}', 'yt_sailing_data',"
          echo "       FALSE, FALSE, FALSE\")"

      - name: Run schema migration (DDL + apps layer)
        run: |
          gcloud run jobs execute yt-sailing-channel-etl-job \
            --args "scripts/migrate_schema.R" \
            --update-env-vars "DATASET=yt_sailing_data,ETL_ENV=production" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait

      - name: Backfill mart tables (full history)
        run: |
          gcloud run jobs execute yt-sailing-channel-etl-job \
            --args "scripts/backfill_marts.R,--start_date=2024-01-01,--end_date=$(date +%Y-%m-%d),--rebuild_fct=FALSE" \
            --update-env-vars "DATASET=yt_sailing_data,ETL_ENV=production" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait

      - name: Rebuild apps layer (post-backfill)
        run: |
          gcloud run jobs execute yt-sailing-channel-etl-job \
            --args "scripts/migrate_schema.R" \
            --update-env-vars "DATASET=yt_sailing_data,ETL_ENV=production" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait

      - name: Run initial ETL to populate GCS cache
        # The ETL reads from the (now-migrated) prod dataset, rebuilds all mart
        # tables for today, and uploads new-format cache files (leaderboard_rankings.rds,
        # channel_info.rds) to GCS. This ensures the new Shiny has data on first boot.
        run: |
          gcloud run jobs execute yt-sailing-channel-etl-job \
            --update-env-vars "DATASET=yt_sailing_data,ETL_ENV=production" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --wait

  # Job 4: Deploy both services only after migration is complete
  deploy:
    needs: [migrate, build-shiny]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Shiny to Cloud Run
        run: |
          gcloud run deploy yt-sailing-shiny \
            --image ${{ env.SHINY_IMAGE_BASE }}:latest \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated

      - name: Update ETL Cloud Run Job
        run: |
          gcloud run jobs update yt-sailing-channel-etl-job \
            --image ${{ env.ETL_IMAGE_BASE }}:latest \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }}