# ====================================================================
# Sailing Channel Dashboard — Configuration
# ====================================================================

# Google Cloud Platform project ID
project: yt-sailing-dashboard

# BigQuery dataset name
dataset: yt_sailing_data

# Rolling window sizes (in days) for mart aggregate metrics.
# Each value produces a separate set of rows in mart_channel_metrics.
# The backfill script loops over these, calling mart_channel_metrics.sql
# once per window size.
window_days:
  - 30
  - 90
  - 180
  - 365
